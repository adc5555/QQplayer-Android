name: android

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  node-artifacts:
    runs-on: ubuntu-22.04
    timeout-minutes: 240
    steps:
      - name: Restore cached libnode artifacts
        id: cache-node
        uses: actions/cache@v4
        with:
          path: node-artifacts
          key: libnode-v22.16.0-ndk26.1.10909125-v2

      - name: Set up Android toolchain
        if: steps.cache-node.outputs.cache-hit != 'true'
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-35 build-tools;35.0.0 ndk;26.1.10909125 cmake;3.22.1"

      - name: Build libnode.so for arm64-v8a
        if: steps.cache-node.outputs.cache-hit != 'true'
        working-directory: /tmp
        run: |
          rm -rf node node-artifacts
          git clone --depth 1 --branch v22.16.0 https://github.com/nodejs/node.git node
          cd node
          export ANDROID_NDK_ROOT="${ANDROID_SDK_ROOT}/ndk/26.1.10909125"
          export TOOLCHAIN="${ANDROID_NDK_ROOT}/toolchains/llvm/prebuilt/linux-x86_64"
          export PATH="${TOOLCHAIN}/bin:${PATH}"
          export CC="${TOOLCHAIN}/bin/aarch64-linux-android29-clang"
          export CXX="${TOOLCHAIN}/bin/aarch64-linux-android29-clang++"
          export CC_host="$(command -v gcc)"
          export CXX_host="$(command -v g++)"
          sed -i 's/__clang_major__ >= 17/__clang_major__ >= 999/' deps/v8/src/handles/handles.h
          export GYP_DEFINES="target_arch=arm64 v8_target_arch=arm64 android_target_arch=arm64 host_os=linux OS=android android_ndk_path=${ANDROID_NDK_ROOT}"
          ./configure \
            --shared \
            --dest-cpu=arm64 \
            --dest-os=android \
            --openssl-no-asm \
            --without-intl \
            --without-npm \
            --without-inspector \
            --without-node-snapshot \
            --cross-compiling
          make -j4
          mkdir -p "${GITHUB_WORKSPACE}/node-artifacts/include/node"
          cp -R include/node/* "${GITHUB_WORKSPACE}/node-artifacts/include/node/"
          mkdir -p "${GITHUB_WORKSPACE}/node-artifacts/lib/arm64-v8a"
          cp out/Release/libnode.so "${GITHUB_WORKSPACE}/node-artifacts/lib/arm64-v8a/libnode.so"

      - name: Upload libnode artifacts
        uses: actions/upload-artifact@v4
        with:
          name: node-artifacts-android-arm64
          path: node-artifacts
          retention-days: 14
          if-no-files-found: error

  build:
    needs: node-artifacts
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Android toolchain
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-35 build-tools;35.0.0 ndk;26.1.10909125 cmake;3.22.1"

      - name: Download libnode artifacts
        uses: actions/download-artifact@v4
        with:
          name: node-artifacts-android-arm64
          path: node-artifacts

      - name: Install and build web/core runner
        env:
          QQPLAYER_NODE_HOME: ${{ github.workspace }}/node-artifacts
        run: |
          pnpm install --ignore-scripts
          pnpm build

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.9

      - name: Assemble debug APK
        env:
          QQPLAYER_NODE_HOME: ${{ github.workspace }}/node-artifacts
        run: |
          cd apps/mobile/android
          gradle :app:assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: qqplayer-android-debug
          path: apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk
