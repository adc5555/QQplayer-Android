name: android

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  node-artifacts:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: Restore cached libnode artifacts
        id: cache-node
        uses: actions/cache@v4
        with:
          path: node-artifacts
          key: libnode-nodejs-mobile-v18.20.4-v1

      - name: Download and extract prebuilt libnode
        if: steps.cache-node.outputs.cache-hit != 'true'
        working-directory: /tmp
        run: |
          curl -L -o nodejs-mobile.zip \
            https://github.com/nodejs-mobile/nodejs-mobile/releases/download/v18.20.4/nodejs-mobile-v18.20.4-android.zip
          unzip -q nodejs-mobile.zip
          mkdir -p "${GITHUB_WORKSPACE}/node-artifacts/include/node"
          cp -R include/node "${GITHUB_WORKSPACE}/node-artifacts/include/"
          mkdir -p "${GITHUB_WORKSPACE}/node-artifacts/lib/arm64-v8a"
          cp bin/arm64-v8a/libnode.so "${GITHUB_WORKSPACE}/node-artifacts/lib/arm64-v8a/libnode.so"

      - name: Upload libnode artifacts
        uses: actions/upload-artifact@v4
        with:
          name: node-artifacts-android-arm64
          path: node-artifacts
          retention-days: 14
          if-no-files-found: error

  build:
    needs: node-artifacts
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Android toolchain
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-35 build-tools;35.0.0 ndk;26.1.10909125 cmake;3.22.1"

      - name: Download libnode artifacts
        uses: actions/download-artifact@v4
        with:
          name: node-artifacts-android-arm64
          path: node-artifacts

      - name: Install and build web/core runner
        env:
          QQPLAYER_NODE_HOME: ${{ github.workspace }}/node-artifacts
        run: |
          pnpm install --ignore-scripts
          pnpm build

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.9

      - name: Assemble debug APK
        env:
          QQPLAYER_NODE_HOME: ${{ github.workspace }}/node-artifacts
        run: |
          cd apps/mobile/android
          gradle :app:assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: qqplayer-android-debug
          path: apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk
